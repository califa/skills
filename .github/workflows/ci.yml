name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The test script passes a glob to node --test, which Node expands only
      # from 21 on. Node 20 still checks the shipped CLI through the dry-run below.
      - run: npm test
        if: matrix.node != 20
      - run: npm run build
      - name: Dry-run the packaged CLI
        shell: bash
        run: |
          npm pack --silent
          npx --yes --package ./califaco-skills-*.tgz califa-skills --all --dry-run --yes
